name: YouTube AI Agent Auto Runner

on:
  schedule:
    - cron: '0 4 * * *' # প্রতিদিন বাংলাদেশ সময় সকাল ১০টায় (UTC সকাল ৪টায়) নিজে নিজে রান হবে
  workflow_dispatch: # ম্যানুয়ালি যেকোনো সময় রান করার বাটন পাওয়ার জন্য

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Run AI Movie Script Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
