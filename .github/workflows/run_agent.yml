name: YouTube AI Agent Auto Runner

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install groq edge-tts moviepy

      - name: Run AI Movie Script Agent & Video Renderer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main.py

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-explanation-video
          path: output.mp4
